[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "styra-neo"
version = "0.1.0"
description = "Starter kit for controlling a Square Off Neo chessboard"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"bleak>=0.22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]